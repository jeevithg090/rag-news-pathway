[project]
name = "live-ai-news"
version = "1.1.0"
description = "Real-time news ingestion, personalised feeds and RAG chat built on Pathway and FastAPI"
requires-python = ">=3.10"

[tool.ruff]
line-length = 120
target-version = "py310"
extend-exclude = ["frontend"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "C4", "RUF"]
ignore = ["B008", "RUF012", "SIM905"]

[tool.ruff.lint.isort]
known-first-party = ["api", "connectors", "pipeline", "rag", "user", "config", "utils"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-ra"
